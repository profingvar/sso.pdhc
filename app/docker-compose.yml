name: sso

services:
  db:
    image: postgres:16-alpine
    container_name: sso_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: sso_db
    ports:
      - "9003:5432"
    volumes:
      - sso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d sso_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: sso_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # +psycopg2 is EXPLICIT and load-bearing (#711, #930): a bare
      # `postgresql://` lets the INSTALLED SQLAlchemy pick the driver, and
      # 2.1 resolves it to psycopg v3, which is not installed here.
      # SQLAlchemy==2.1.3 — ALREADY on the release #711 is about, so a
      # `--build` from this file would have crash-looped sso, the platform's
      # auth service. The most load-bearing of the seven.
      DATABASE_URL: postgresql+psycopg2://sso_user:${DB_PASSWORD}@db:5432/sso_db
    env_file:
      - .env
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sso_pgdata:
    name: app_sso_pgdata
    external: true
