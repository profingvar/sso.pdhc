name: pytest

# SSO reform S7 (#403) — first CI for sso.pdhc. Runs the pytest suite on
# push + PR, including the access-model reform tests (care hierarchy, role
# registry, affiliations, Option-C phases, blob contract). Mirrors the
# pattern used across the pdhc platform (request #376, ips #389, etc.).

on:
  push:
    paths: ['app/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/test.yml']
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt
      - name: Install deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true
          pip install pytest
      - name: Run pytest
        working-directory: app
        env:
          SECRET_KEY: 'ci-only-not-secret-min-32-chars-padding'
        run: PYTHONPATH=. pytest tests -q
